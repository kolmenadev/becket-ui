name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The style check diffs the PR against its base branch, so it needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Warn mode: findings show as annotations on the PR without failing it. CI can't tell a name
      # kept with a written reason from a slip (the commit hooks let those pass on a second try).
      # Drop continue-on-error once the check reads reason comments for names.
      - name: Style check (lines this PR adds)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm lint:style --base origin/${{ github.base_ref }}
      - run: pnpm publish:check
      - run: pnpm build
      - run: pnpm --filter @becket-ui/react exec tsc --noEmit -p tsconfig.build.json
      - run: pnpm --filter @becket-ui/tokens typecheck
      - run: pnpm --filter @becket-ui/a11y test
      - run: pnpm --filter @becket-ui/react test
      - run: pnpm --filter @becket-ui/tokens test
      - run: pnpm --filter @becket-ui/mcp test
      - run: pnpm pack:check
      - run: pnpm example:build
      - run: node scripts/assert-next-example.mjs
