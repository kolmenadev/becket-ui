name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The style check diffs the PR against its base branch, so it needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Warn mode: findings show as annotations on the PR without failing it. CI can't tell a name
      # kept with a written reason from a slip (the commit hooks let those pass on a second try).
      # Drop continue-on-error once the check reads reason comments for names.
      - name: Style check (lines this PR adds)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm lint:style --base origin/${{ github.base_ref }}
      - run: pnpm publish:check
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm --filter @becket-ui/react exec tsc --noEmit -p tsconfig.build.json
      - run: pnpm --filter @becket-ui/tokens typecheck
      - run: pnpm --filter @becket-ui/a11y test
      - run: pnpm --filter @becket-ui/react test
      - run: pnpm --filter @becket-ui/react test:browser
      - run: pnpm --filter @becket-ui/tokens test
      - run: pnpm --filter @becket-ui/mcp test
      - run: pnpm test:style-check
      - run: pnpm test:api-report
      - run: pnpm pack:check
      - run: pnpm example:build
      - run: node scripts/assert-next-example.mjs

  a11y-browser:
    needs: check
    runs-on: ubuntu-latest
    # Browser axe is on trial for its first two weeks; at the 0.12 gate this line goes and the job
    # becomes a required status check.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @becket-ui/react test:browser
      # Uploaded when the run fails too: that is when the report is needed.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-results
          path: packages/react/axe-results/
