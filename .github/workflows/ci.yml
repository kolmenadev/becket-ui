name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @becket-ui/react exec tsc --noEmit -p tsconfig.build.json
      - run: pnpm --filter @becket-ui/a11y test
      - run: pnpm --filter @becket-ui/react test
      - run: pnpm --filter @becket-ui/tokens test
      - run: pnpm pack:check
      - run: pnpm example:build
      - run: node scripts/assert-next-example.mjs
